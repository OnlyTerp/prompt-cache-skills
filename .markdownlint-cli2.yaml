config:
  default: true
  # Line length: Markdown tables and diffs routinely exceed any reasonable limit.
  MD013: false
  # Allow inline HTML (used for table layout in some audits).
  MD033: false
  # Duplicate headings: every SKILL.md uses ## Target / ## Symptom / ## Fix etc.
  MD024:
    siblings_only: true
  # First-line H1 not required for SKILL.md files (they lead with YAML frontmatter).
  MD041: false
  # Bare URLs are fine in audits — they reference issue numbers and source.
  MD034: false
  # Allow # at line start without a space when quoting GitHub issue/PR refs (#1234).
  MD018: false
  # Trailing punctuation in headings is fine for audit headings like "PR #11984:".
  MD026: false
ignores:
  - "skills/_TEMPLATE/**"
  - "audits/_TEMPLATE.md"
