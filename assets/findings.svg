<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430">
  <defs>
    <linearGradient id="fn-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="fn-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="430" rx="12" fill="url(#fn-bg)"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#e2e8f0" letter-spacing="0.5">Headline Findings</text>
  <rect x="375" y="44" width="150" height="2" rx="1" fill="url(#fn-accent)" opacity="0.6"/>

  <!-- Finding 1 -->
  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="390" height="80" rx="8" fill="#1e1b4b" fill-opacity="0.35" stroke="#ef4444" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="28" cy="16" r="12" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="28" y="21" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#fca5a5">1</text>
    <text x="50" y="20" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#fca5a5">Copy-paste volatile-message bug</text>
    <text x="18" y="42" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">Cline → Roo → Continue all burn a cache breakpoint</text>
    <text x="18" y="58" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">on the volatile current turn. Same one-line fix in each.</text>
    <rect x="300" y="50" width="76" height="20" rx="10" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="0.8" stroke-opacity="0.3"/>
    <text x="338" y="64" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="600" fill="#fca5a5">3 harnesses</text>
  </g>

  <!-- Finding 2 -->
  <g transform="translate(460, 70)">
    <rect x="0" y="0" width="390" height="80" rx="8" fill="#1e1b4b" fill-opacity="0.35" stroke="#ef4444" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="28" cy="16" r="12" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="28" y="21" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#fca5a5">2</text>
    <text x="50" y="20" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#fca5a5">Cline OpenAI is silently broken</text>
    <text x="18" y="42" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">No prompt_cache_key, no prefix-stability work.</text>
    <text x="18" y="58" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">Users on Cline+OpenAI pay full price every turn.</text>
    <rect x="307" y="50" width="70" height="20" rx="10" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="0.8" stroke-opacity="0.3"/>
    <text x="342" y="64" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="600" fill="#fca5a5">0% cache</text>
  </g>

  <!-- Finding 3 -->
  <g transform="translate(50, 164)">
    <rect x="0" y="0" width="390" height="80" rx="8" fill="#1e1b4b" fill-opacity="0.35" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="28" cy="16" r="12" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="28" y="21" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#fcd34d">3</text>
    <text x="50" y="20" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#fcd34d">Gemini explicit caching unimplemented</text>
    <text x="18" y="42" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">Only implicit (best-effort, free) caching engages.</text>
    <text x="18" y="58" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">Missing guaranteed 75% discount on long sessions.</text>
    <rect x="305" y="50" width="72" height="20" rx="10" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="0.8" stroke-opacity="0.3"/>
    <text x="341" y="64" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="600" fill="#fcd34d">universal</text>
  </g>

  <!-- Finding 4 -->
  <g transform="translate(460, 164)">
    <rect x="0" y="0" width="390" height="80" rx="8" fill="#1e1b4b" fill-opacity="0.35" stroke="#10b981" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="28" cy="16" r="12" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="28" y="21" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7">4</text>
    <text x="50" y="20" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#6ee7b7">Codex CLI is the reference impl</text>
    <text x="18" y="42" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">thread_id as cache key, preserved across</text>
    <text x="18" y="58" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">compaction and into sub-agents.</text>
    <rect x="302" y="50" width="76" height="20" rx="10" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.3"/>
    <text x="340" y="64" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="600" fill="#6ee7b7">gold std</text>
  </g>

  <!-- Finding 5 -->
  <g transform="translate(50, 258)">
    <rect x="0" y="0" width="390" height="60" rx="8" fill="#1e1b4b" fill-opacity="0.35" stroke="#10b981" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="28" cy="16" r="12" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="28" y="21" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7">5</text>
    <text x="50" y="20" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#6ee7b7">OpenCode has best Anthropic pattern</text>
    <text x="18" y="42" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">System-prompt split maximizes cache stability.</text>
  </g>

  <!-- Finding 6 (Hermes/Nous — previously missing) -->
  <g transform="translate(460, 258)">
    <rect x="0" y="0" width="390" height="60" rx="8" fill="#1e1b4b" fill-opacity="0.35" stroke="#10b981" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="28" cy="16" r="12" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="28" y="21" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7">6</text>
    <text x="50" y="20" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#6ee7b7">Hermes/Nous has real cache plumbing</text>
    <text x="18" y="42" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">Multi-provider cache with xAI wire-verified tokens.</text>
  </g>

  <!-- Finding 7 -->
  <g transform="translate(50, 340)">
    <rect x="0" y="0" width="800" height="60" rx="8" fill="#1e1b4b" fill-opacity="0.35" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="28" cy="16" r="12" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="28" y="21" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#93c5fd">7</text>
    <text x="50" y="20" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#93c5fd">Closed managed surfaces need transport-aware capture</text>
    <text x="18" y="42" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">Devin, Windsurf, Antigravity, and Grok CLI marked unverified — protobuf, desktop-only, or proxy-invisible channels.</text>
  </g>

  <!-- Border -->
  <rect x="0.5" y="0.5" width="899" height="429" rx="12" fill="none" stroke="#6366f1" stroke-width="0.5" stroke-opacity="0.15"/>
</svg>
