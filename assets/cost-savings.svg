<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <linearGradient id="cs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cs-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="cs-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cs-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="cs-glow-green">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10b981" flood-opacity="0.4"/>
    </filter>
    <filter id="cs-glow-red">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ef4444" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="300" rx="12" fill="url(#cs-bg)"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#e2e8f0" letter-spacing="0.5">Why This Matters</text>
  <rect x="375" y="47" width="150" height="2" rx="1" fill="url(#cs-accent)" opacity="0.6"/>

  <!-- Subtitle -->
  <text x="450" y="70" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8">50-turn coding session on Claude Opus with 30k system prompt tokens</text>

  <!-- LEFT: Without fix -->
  <g transform="translate(225, 90)">
    <rect x="-160" y="0" width="320" height="170" rx="10" fill="#1c1917" fill-opacity="0.6" stroke="#ef4444" stroke-width="1" stroke-opacity="0.25"/>
    <rect x="-160" y="0" width="320" height="36" rx="10" fill="#ef4444" fill-opacity="0.1"/>
    <rect x="-160" y="26" width="320" height="10" fill="#1c1917" fill-opacity="0.6"/>
    <text x="0" y="23" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#fca5a5" letter-spacing="1">WITHOUT PROMPT CACHING</text>
    <text x="0" y="80" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="48" font-weight="800" fill="#ef4444" filter="url(#cs-glow-red)">$7.50</text>
    <text x="0" y="100" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#94a3b8">per session</text>
    <rect x="-120" y="118" width="240" height="16" rx="8" fill="#ef4444" fill-opacity="0.25"/>
    <rect x="-120" y="118" width="240" height="16" rx="8" fill="url(#cs-red)" opacity="0.7"/>
    <text x="0" y="130" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="600" fill="#fff">$0.15 per turn x 50 turns</text>
    <text x="0" y="155" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">Full-price input tokens every turn</text>
  </g>

  <!-- Center arrow -->
  <g transform="translate(450, 175)">
    <polygon points="-12,-14 12,0 -12,14" fill="#6366f1" opacity="0.6"/>
    <text x="0" y="35" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#a5b4fc">10x</text>
  </g>

  <!-- RIGHT: With fix -->
  <g transform="translate(675, 90)">
    <rect x="-160" y="0" width="320" height="170" rx="10" fill="#022c22" fill-opacity="0.4" stroke="#10b981" stroke-width="1" stroke-opacity="0.25"/>
    <rect x="-160" y="0" width="320" height="36" rx="10" fill="#10b981" fill-opacity="0.1"/>
    <rect x="-160" y="26" width="320" height="10" fill="#022c22" fill-opacity="0.4"/>
    <text x="0" y="23" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#6ee7b7" letter-spacing="1">WITH PROMPT CACHING</text>
    <text x="0" y="80" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="48" font-weight="800" fill="#10b981" filter="url(#cs-glow-green)">$0.75</text>
    <text x="0" y="100" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#94a3b8">per session</text>
    <rect x="-120" y="118" width="240" height="16" rx="8" fill="#10b981" fill-opacity="0.1"/>
    <rect x="-120" y="118" width="24" height="16" rx="8" fill="url(#cs-green)" opacity="0.7"/>
    <text x="-108" y="130" text-anchor="start" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="600" fill="#fff">$0.015</text>
    <text x="-50" y="130" text-anchor="start" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" fill="#6ee7b7" opacity="0.7">90% cached @ 10% price</text>
    <text x="0" y="155" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">System prompt cached across turns</text>
  </g>

  <!-- Bottom note -->
  <text x="450" y="285" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#64748b" font-style="italic">Based on Anthropic Claude 4.7 Opus pricing. Actual savings vary by model and provider.</text>

  <!-- Border -->
  <rect x="0.5" y="0.5" width="899" height="299" rx="12" fill="none" stroke="#6366f1" stroke-width="0.5" stroke-opacity="0.15"/>
</svg>
