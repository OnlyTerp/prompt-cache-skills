<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" width="900" height="310">
  <defs>
    <linearGradient id="cs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cs-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="cs-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cs-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="cs-glow-green">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#10b981" flood-opacity="0.4"/>
    </filter>
    <filter id="cs-glow-red">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#ef4444" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="310" rx="12" fill="url(#cs-bg)"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9" letter-spacing="0.5">Why This Matters</text>
  <rect x="370" y="50" width="160" height="2.5" rx="1" fill="url(#cs-accent)" opacity="0.7"/>

  <!-- Subtitle -->
  <text x="450" y="74" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#cbd5e1">50-turn coding session on Claude Opus with 30k system prompt tokens</text>

  <!-- LEFT: Without fix -->
  <g transform="translate(225, 94)">
    <rect x="-165" y="0" width="330" height="174" rx="10" fill="#1c1917" fill-opacity="0.6" stroke="#ef4444" stroke-width="1" stroke-opacity="0.3"/>
    <rect x="-165" y="0" width="330" height="38" rx="10" fill="#ef4444" fill-opacity="0.1"/>
    <rect x="-165" y="28" width="330" height="10" fill="#1c1917" fill-opacity="0.6"/>
    <text x="0" y="25" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#fca5a5" letter-spacing="1">WITHOUT PROMPT CACHING</text>
    <text x="0" y="85" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="52" font-weight="800" fill="#ef4444" filter="url(#cs-glow-red)">$7.50</text>
    <text x="0" y="108" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#cbd5e1">per session</text>
    <rect x="-125" y="122" width="250" height="18" rx="9" fill="#ef4444" fill-opacity="0.25"/>
    <rect x="-125" y="122" width="250" height="18" rx="9" fill="url(#cs-red)" opacity="0.7"/>
    <text x="0" y="135" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#fff">$0.15 per turn × 50 turns</text>
    <text x="0" y="162" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#cbd5e1">Full-price input tokens every turn</text>
  </g>

  <!-- Center arrow + savings badge -->
  <g transform="translate(450, 180)">
    <polygon points="-14,-16 14,0 -14,16" fill="#6366f1" opacity="0.7"/>
    <rect x="-22" y="22" width="44" height="22" rx="11" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-width="1" stroke-opacity="0.4"/>
    <text x="0" y="38" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="800" fill="#c7d2fe">10×</text>
  </g>

  <!-- RIGHT: With fix -->
  <g transform="translate(675, 94)">
    <rect x="-165" y="0" width="330" height="174" rx="10" fill="#022c22" fill-opacity="0.4" stroke="#10b981" stroke-width="1" stroke-opacity="0.3"/>
    <rect x="-165" y="0" width="330" height="38" rx="10" fill="#10b981" fill-opacity="0.1"/>
    <rect x="-165" y="28" width="330" height="10" fill="#022c22" fill-opacity="0.4"/>
    <text x="0" y="25" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#86efac" letter-spacing="1">WITH PROMPT CACHING</text>
    <text x="0" y="85" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="52" font-weight="800" fill="#10b981" filter="url(#cs-glow-green)">$0.75</text>
    <text x="0" y="108" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#cbd5e1">per session</text>
    <rect x="-125" y="122" width="250" height="18" rx="9" fill="#10b981" fill-opacity="0.1"/>
    <rect x="-125" y="122" width="25" height="18" rx="9" fill="url(#cs-green)" opacity="0.7"/>
    <text x="-112" y="135" text-anchor="start" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#fff">$0.015</text>
    <text x="-50" y="135" text-anchor="start" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#86efac" opacity="0.8">90% cached @ 10% price</text>
    <text x="0" y="162" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#cbd5e1">System prompt cached across turns</text>
  </g>

  <!-- Bottom note -->
  <text x="450" y="296" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8" font-style="italic">Based on Anthropic Claude 4.7 Opus pricing. Actual savings vary by model and provider.</text>

  <!-- Border -->
  <rect x="0.5" y="0.5" width="899" height="309" rx="12" fill="none" stroke="#6366f1" stroke-width="0.5" stroke-opacity="0.15"/>
</svg>
