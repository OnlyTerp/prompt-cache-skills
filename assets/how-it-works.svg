<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <linearGradient id="hw-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="hw-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="hw-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="hw-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="hw-card-shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" rx="12" fill="url(#hw-bg)"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#e2e8f0" letter-spacing="0.5">How It Works</text>
  <rect x="375" y="47" width="150" height="2" rx="1" fill="url(#hw-purple)" opacity="0.6"/>

  <!-- Step 1: Point -->
  <g transform="translate(115, 95)" filter="url(#hw-card-shadow)">
    <rect x="-90" y="-20" width="180" height="155" rx="12" fill="#1e1b4b" fill-opacity="0.5" stroke="#6366f1" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="0" cy="-20" r="16" fill="url(#hw-purple)"/>
    <text x="0" y="-15" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff">1</text>
    <g transform="translate(-15, 15)">
      <path d="M15,0 L15,30 L21,24 L27,36 L31,34 L25,22 L33,22 Z" fill="#a5b4fc" opacity="0.8"/>
    </g>
    <text x="0" y="70" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">Point</text>
    <text x="0" y="90" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">Tell your AI agent</text>
    <text x="0" y="105" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">to read this repo</text>
  </g>

  <!-- Arrow 1-2 -->
  <g transform="translate(245, 148)">
    <line x1="0" y1="0" x2="70" y2="0" stroke="#6366f1" stroke-width="2" stroke-dasharray="4,4" opacity="0.5"/>
    <polygon points="70,-5 80,0 70,5" fill="#6366f1" opacity="0.7"/>
  </g>

  <!-- Step 2: Detect -->
  <g transform="translate(375, 95)" filter="url(#hw-card-shadow)">
    <rect x="-90" y="-20" width="180" height="155" rx="12" fill="#1e1b4b" fill-opacity="0.5" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="0" cy="-20" r="16" fill="url(#hw-blue)"/>
    <text x="0" y="-15" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff">2</text>
    <g transform="translate(-12, 12)">
      <circle cx="14" cy="14" r="11" fill="none" stroke="#93c5fd" stroke-width="2.5" opacity="0.8"/>
      <line x1="22" y1="22" x2="30" y2="30" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    </g>
    <text x="0" y="70" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">Detect &amp; Patch</text>
    <text x="0" y="90" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">Agent reads each SKILL.md,</text>
    <text x="0" y="105" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">matches &amp; applies the fix</text>
  </g>

  <!-- Arrow 2-3 -->
  <g transform="translate(505, 148)">
    <line x1="0" y1="0" x2="70" y2="0" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4,4" opacity="0.5"/>
    <polygon points="70,-5 80,0 70,5" fill="#3b82f6" opacity="0.7"/>
  </g>

  <!-- Step 3: Verify -->
  <g transform="translate(635, 95)" filter="url(#hw-card-shadow)">
    <rect x="-90" y="-20" width="180" height="155" rx="12" fill="#1e1b4b" fill-opacity="0.5" stroke="#10b981" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="0" cy="-20" r="16" fill="url(#hw-green)"/>
    <text x="0" y="-15" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff">3</text>
    <g transform="translate(-14, 10)">
      <path d="M14,2 L2,8 L2,18 C2,26 14,34 14,34 C14,34 26,26 26,18 L26,8 Z" fill="none" stroke="#6ee7b7" stroke-width="2" opacity="0.8"/>
      <polyline points="9,18 13,22 20,13" fill="none" stroke="#6ee7b7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    </g>
    <text x="0" y="70" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">Verify &amp; Save</text>
    <text x="0" y="90" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">Confirms cache hits</text>
    <text x="0" y="105" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">on the wire — up to 10x</text>
  </g>

  <!-- Bottom note -->
  <text x="450" y="265" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#64748b" font-style="italic">Works with Claude Code, Codex, Cline, Cursor, Devin, Gemini CLI, and any agent that reads markdown</text>

  <!-- Border -->
  <rect x="0.5" y="0.5" width="899" height="279" rx="12" fill="none" stroke="#6366f1" stroke-width="0.5" stroke-opacity="0.15"/>
</svg>
