<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290">
  <defs>
    <linearGradient id="hw-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="hw-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="hw-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="hw-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="hw-card-shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="290" rx="12" fill="url(#hw-bg)"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9" letter-spacing="0.5">How It Works</text>
  <rect x="370" y="50" width="160" height="2.5" rx="1" fill="url(#hw-purple)" opacity="0.7"/>

  <!-- Step 1: Point -->
  <g transform="translate(115, 100)" filter="url(#hw-card-shadow)">
    <rect x="-90" y="-20" width="180" height="160" rx="12" fill="#1e1b4b" fill-opacity="0.5" stroke="#6366f1" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="0" cy="-20" r="18" fill="url(#hw-purple)"/>
    <text x="0" y="-14" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff">1</text>
    <g transform="translate(-16, 14)">
      <path d="M16,0 L16,28 L22,22 L28,34 L32,32 L26,20 L34,20 Z" fill="#c7d2fe" opacity="0.8"/>
    </g>
    <text x="0" y="68" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="700" fill="#f1f5f9">Point</text>
    <text x="0" y="92" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#cbd5e1">Tell your AI agent</text>
    <text x="0" y="110" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#cbd5e1">to read this repo</text>
  </g>

  <!-- Arrow 1-2 -->
  <g transform="translate(245, 155)">
    <line x1="0" y1="0" x2="70" y2="0" stroke="#6366f1" stroke-width="2" stroke-dasharray="4,4" opacity="0.5"/>
    <polygon points="70,-6 82,0 70,6" fill="#6366f1" opacity="0.7"/>
  </g>

  <!-- Step 2: Detect -->
  <g transform="translate(375, 100)" filter="url(#hw-card-shadow)">
    <rect x="-90" y="-20" width="180" height="160" rx="12" fill="#1e1b4b" fill-opacity="0.5" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="0" cy="-20" r="18" fill="url(#hw-blue)"/>
    <text x="0" y="-14" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff">2</text>
    <g transform="translate(-13, 12)">
      <circle cx="14" cy="14" r="12" fill="none" stroke="#bfdbfe" stroke-width="2.5" opacity="0.8"/>
      <line x1="23" y1="23" x2="31" y2="31" stroke="#bfdbfe" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    </g>
    <text x="0" y="68" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="700" fill="#f1f5f9">Detect &amp; Patch</text>
    <text x="0" y="92" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#cbd5e1">Agent reads each SKILL.md,</text>
    <text x="0" y="110" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#cbd5e1">matches &amp; applies the fix</text>
  </g>

  <!-- Arrow 2-3 -->
  <g transform="translate(505, 155)">
    <line x1="0" y1="0" x2="70" y2="0" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4,4" opacity="0.5"/>
    <polygon points="70,-6 82,0 70,6" fill="#3b82f6" opacity="0.7"/>
  </g>

  <!-- Step 3: Verify -->
  <g transform="translate(635, 100)" filter="url(#hw-card-shadow)">
    <rect x="-90" y="-20" width="180" height="160" rx="12" fill="#1e1b4b" fill-opacity="0.5" stroke="#10b981" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="0" cy="-20" r="18" fill="url(#hw-green)"/>
    <text x="0" y="-14" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff">3</text>
    <g transform="translate(-14, 10)">
      <path d="M14,2 L2,8 L2,18 C2,26 14,34 14,34 C14,34 26,26 26,18 L26,8 Z" fill="none" stroke="#86efac" stroke-width="2" opacity="0.8"/>
      <polyline points="9,18 13,22 20,13" fill="none" stroke="#86efac" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    </g>
    <text x="0" y="68" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="700" fill="#f1f5f9">Verify &amp; Save</text>
    <text x="0" y="92" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#cbd5e1">Confirms cache hits</text>
    <text x="0" y="110" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#cbd5e1">on the wire — up to 10x</text>
  </g>

  <!-- Bottom note -->
  <text x="450" y="278" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#94a3b8" font-style="italic">Works with Claude Code, Codex, Cline, Cursor, Devin, Gemini CLI, and any agent that reads markdown</text>

  <!-- Border -->
  <rect x="0.5" y="0.5" width="899" height="289" rx="12" fill="none" stroke="#6366f1" stroke-width="0.5" stroke-opacity="0.15"/>
</svg>
