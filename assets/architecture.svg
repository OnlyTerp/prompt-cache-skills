        <text x="-80" y="43" font-family="'Courier New', monospace" font-size="11" fill="#86efac">check_docs_consistency.py</text>
        <text x="-80" y="62" font-family="'Courier New', monospace" font-size="11" fill="#86efac">audit_harness.sh</text>
        <text x="-80" y="81" font-family="'Courier New', monospace" font-size="11" fill="#86efac">replay_harness.md</text>
