      <text x="-80" y="40" font-family="'Courier New', monospace" font-size="10" fill="#67e8f9">concepts/openai.md</text>
      <text x="-80" y="58" font-family="'Courier New', monospace" font-size="10" fill="#67e8f9">concepts/gemini.md</text>
      <text x="-80" y="76" font-family="'Courier New', monospace" font-size="10" fill="#67e8f9">concepts/bedrock.md</text>
      <text x="-80" y="94" font-family="'Courier New', monospace" font-size="10" fill="#67e8f9">gotchas.md</text>
