      <text x="-80" y="43" font-family="'Courier New', monospace" font-size="11" fill="#bfdbfe">codex-cli.md</text>
      <text x="-80" y="62" font-family="'Courier New', monospace" font-size="11" fill="#bfdbfe">aider.md</text>
      <text x="-80" y="81" font-family="'Courier New', monospace" font-size="11" fill="#bfdbfe">opencode.md</text>
      <text x="-80" y="100" font-family="'Courier New', monospace" font-size="11" fill="#bfdbfe">roo-code.md</text>
      <text x="-80" y="119" font-family="'Courier New', monospace" font-size="11" fill="#bfdbfe">cline.md</text>
      <text x="-80" y="138" font-family="'Courier New', monospace" font-size="11" fill="#bfdbfe">continue.md</text>
      <text x="-80" y="157" font-family="'Courier New', monospace" font-size="11" fill="#bfdbfe">hermes-nous.md</text>
      <text x="-80" y="176" font-family="'Courier New', monospace" font-size="11" fill="#bfdbfe">codex-desktop.md</text>
      <text x="-80" y="195" font-family="'Courier New', monospace" font-size="11" fill="#bfdbfe">devin-cli.md</text>
      <text x="-80" y="214" font-family="'Courier New', monospace" font-size="11" fill="#bfdbfe">windsurf-cascade.md</text>
      <text x="-80" y="233" font-family="'Courier New', monospace" font-size="11" fill="#bfdbfe">antigravity.md</text>
      <text x="-80" y="252" font-family="'Courier New', monospace" font-size="11" fill="#bfdbfe">grok-cli.md</text>
      <text x="-80" y="274" font-family="'Courier New', monospace" font-size="10" fill="#94a3b8" font-style="italic">+ 6 queued stubs</text>
      <rect x="24" y="282" width="63" height="14" rx="7" fill="#3b82f6" fill-opacity="0.3"/>
      <text x="55" y="292" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="600" fill="#bfdbfe">13 + 6</text>
    </g>
  </g>

  <!-- Docs + Tools Column (right) -->
