    <rect x="-100" y="-12" width="200" height="32" rx="6" fill="url(#ar-teal)" opacity="0.9"/>
    <text x="0" y="11" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff">docs/</text>
