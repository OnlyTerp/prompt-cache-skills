      <text x="-80" y="40" font-family="'Courier New', monospace" font-size="10" fill="#a5b4fc">cline-openai-cache-key/</text>
      <text x="-80" y="58" font-family="'Courier New', monospace" font-size="10" fill="#a5b4fc">cline-pin-timestamp/</text>
      <text x="-80" y="76" font-family="'Courier New', monospace" font-size="10" fill="#a5b4fc">roo-fix-volatile-msg/</text>
      <text x="-80" y="94" font-family="'Courier New', monospace" font-size="10" fill="#a5b4fc">roo-bedrock-custom-arn/</text>
      <text x="-80" y="112" font-family="'Courier New', monospace" font-size="10" fill="#a5b4fc">continue-fix-volatile-msg/</text>
      <text x="-80" y="130" font-family="'Courier New', monospace" font-size="10" fill="#a5b4fc">continue-enable-defaults/</text>
      <text x="-80" y="148" font-family="'Courier New', monospace" font-size="10" fill="#a5b4fc">continue-gemini-explicit/</text>
      <text x="-80" y="166" font-family="'Courier New', monospace" font-size="10" fill="#a5b4fc">opencode-detect-compat/</text>
      <text x="-80" y="184" font-family="'Courier New', monospace" font-size="10" fill="#a5b4fc">opencode-bedrock-docs/</text>
      <text x="-80" y="202" font-family="'Courier New', monospace" font-size="10" fill="#a5b4fc">opencode-mistral-cache/</text>
