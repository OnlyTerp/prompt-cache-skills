    <text x="0" y="11" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff">skills/</text>
    <g transform="translate(0, 34)">
      <rect x="-95" y="0" width="190" height="270" rx="8" fill="#1e1b4b" fill-opacity="0.4" stroke="#6366f1" stroke-width="0.5" stroke-opacity="0.3"/>
      <text x="-80" y="24" font-family="'Courier New', monospace" font-size="11" fill="#c7d2fe">cline-fix-volatile-msg/</text>
      <text x="-80" y="43" font-family="'Courier New', monospace" font-size="11" fill="#c7d2fe">cline-openai-cache-key/</text>
      <text x="-80" y="62" font-family="'Courier New', monospace" font-size="11" fill="#c7d2fe">cline-pin-timestamp/</text>
      <text x="-80" y="81" font-family="'Courier New', monospace" font-size="11" fill="#c7d2fe">zoo-fix-volatile-msg/</text>
      <text x="-80" y="100" font-family="'Courier New', monospace" font-size="11" fill="#c7d2fe">roo-bedrock-custom-arn/</text>
      <text x="-80" y="119" font-family="'Courier New', monospace" font-size="11" fill="#c7d2fe">continue-fix-volatile/</text>
      <text x="-80" y="138" font-family="'Courier New', monospace" font-size="11" fill="#c7d2fe">continue-enable-def/</text>
      <text x="-80" y="157" font-family="'Courier New', monospace" font-size="11" fill="#c7d2fe">continue-gemini-exp/</text>
      <text x="-80" y="176" font-family="'Courier New', monospace" font-size="11" fill="#c7d2fe">opencode-detect-compat/</text>
      <text x="-80" y="195" font-family="'Courier New', monospace" font-size="11" fill="#c7d2fe">opencode-bedrock-docs/</text>
      <text x="-80" y="214" font-family="'Courier New', monospace" font-size="11" fill="#c7d2fe">opencode-mistral-cache/</text>
      <text x="-80" y="233" font-family="'Courier New', monospace" font-size="11" fill="#c7d2fe">aider-1h-ttl/</text>
      <text x="-80" y="252" font-family="'Courier New', monospace" font-size="11" fill="#c7d2fe">aider-cache-default-on/</text>
    </g>
