      <text x="-80" y="43" font-family="'Courier New', monospace" font-size="11" fill="#a5f3fc">concepts/openai.md</text>
      <text x="-80" y="62" font-family="'Courier New', monospace" font-size="11" fill="#a5f3fc">concepts/gemini.md</text>
      <text x="-80" y="81" font-family="'Courier New', monospace" font-size="11" fill="#a5f3fc">concepts/bedrock.md</text>
      <text x="-80" y="100" font-family="'Courier New', monospace" font-size="11" fill="#a5f3fc">gotchas.md</text>
