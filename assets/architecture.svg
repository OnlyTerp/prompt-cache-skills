      <text x="-80" y="112" font-family="'Courier New', monospace" font-size="10" fill="#93c5fd">cline.md</text>
      <text x="-80" y="130" font-family="'Courier New', monospace" font-size="10" fill="#93c5fd">continue.md</text>
      <text x="-80" y="148" font-family="'Courier New', monospace" font-size="10" fill="#93c5fd">hermes-nous.md</text>
      <text x="-80" y="166" font-family="'Courier New', monospace" font-size="10" fill="#93c5fd">codex-desktop.md</text>
      <text x="-80" y="184" font-family="'Courier New', monospace" font-size="10" fill="#93c5fd">devin-cli.md</text>
      <text x="-80" y="202" font-family="'Courier New', monospace" font-size="10" fill="#93c5fd">windsurf-cascade.md</text>
      <text x="-80" y="220" font-family="'Courier New', monospace" font-size="10" fill="#93c5fd">antigravity.md</text>
      <text x="-80" y="238" font-family="'Courier New', monospace" font-size="10" fill="#93c5fd">grok-cli.md</text>
