<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <filter id="textshadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#6366f1" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" rx="16" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#8b5cf6" stroke-width="0.5">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="0" y1="280" x2="900" y2="280"/>
    <line x1="100" y1="0" x2="100" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="500" y1="0" x2="500" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="700" y1="0" x2="700" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
  </g>

  <!-- Top glow arc -->
  <ellipse cx="450" cy="-60" rx="500" ry="180" fill="url(#glow)" opacity="0.5"/>

  <!-- Decorative cache icon (left side) -->
  <g transform="translate(70, 80)" opacity="0.12">
    <ellipse cx="60" cy="20" rx="55" ry="16" fill="#8b5cf6" stroke="#a78bfa" stroke-width="1"/>
    <ellipse cx="60" cy="50" rx="55" ry="16" fill="#8b5cf6" stroke="#a78bfa" stroke-width="1"/>
    <ellipse cx="60" cy="80" rx="55" ry="16" fill="#8b5cf6" stroke="#a78bfa" stroke-width="1"/>
    <ellipse cx="60" cy="110" rx="55" ry="16" fill="#8b5cf6" stroke="#a78bfa" stroke-width="1"/>
    <line x1="5" y1="20" x2="5" y2="110" stroke="#a78bfa" stroke-width="1"/>
    <line x1="115" y1="20" x2="115" y2="110" stroke="#a78bfa" stroke-width="1"/>
  </g>

  <!-- Decorative circuit lines (right side) -->
  <g transform="translate(700, 60)" opacity="0.1" stroke="#8b5cf6" stroke-width="1.5" fill="none">
    <path d="M0,40 L40,40 L40,0 L80,0"/>
    <path d="M0,80 L30,80 L30,120 L80,120"/>
    <path d="M0,140 L50,140 L50,100 L80,100"/>
    <path d="M0,180 L20,180 L20,160 L60,160 L60,200 L80,200"/>
    <circle cx="80" cy="0" r="3" fill="#8b5cf6"/>
    <circle cx="80" cy="100" r="3" fill="#8b5cf6"/>
    <circle cx="80" cy="120" r="3" fill="#8b5cf6"/>
    <circle cx="80" cy="200" r="3" fill="#8b5cf6"/>
  </g>

  <!-- Main title -->
  <text x="450" y="110" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="46" font-weight="700" fill="#f1f5f9" filter="url(#textshadow)" letter-spacing="-1">
    prompt-cache-skills
  </text>

  <!-- Accent line under title -->
  <rect x="300" y="125" width="300" height="3" rx="1.5" fill="url(#accent)" opacity="0.8"/>

  <!-- Tagline -->
  <text x="450" y="165" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" fill="#94a3b8" letter-spacing="0.5">
    Drop-in prompt-caching fixes for every LLM agent harness
  </text>

  <!-- Stats row -->
  <g transform="translate(450, 210)">
    <!-- 13 Skills -->
    <g transform="translate(-260, 0)">
      <rect x="-55" y="-18" width="110" height="36" rx="18" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-width="1" stroke-opacity="0.4"/>
      <text x="0" y="6" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#a5b4fc">13 Skills</text>
    </g>
    <!-- 13 Audits -->
    <g transform="translate(-110, 0)">
      <rect x="-75" y="-18" width="150" height="36" rx="18" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-width="1" stroke-opacity="0.4"/>
      <text x="0" y="6" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#a5b4fc">13 Audits</text>
    </g>
    <!-- 4 Providers -->
    <g transform="translate(60, 0)">
      <rect x="-70" y="-18" width="140" height="36" rx="18" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-width="1" stroke-opacity="0.4"/>
      <text x="0" y="6" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#a5b4fc">4 Providers</text>
    </g>
    <!-- 10x Savings -->
    <g transform="translate(220, 0)">
      <rect x="-65" y="-18" width="130" height="36" rx="18" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
      <text x="0" y="6" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#6ee7b7">Up to 10x Savings</text>
    </g>
  </g>

  <!-- Bottom tagline -->
  <text x="450" y="275" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#64748b" letter-spacing="0.5">
    Point your AI agent at this repo. It reads the skills. It ships the patches. You save money.
  </text>

  <!-- Border glow -->
  <rect x="0.5" y="0.5" width="899" height="319" rx="16" fill="none" stroke="url(#accent)" stroke-width="1" stroke-opacity="0.2"/>
</svg>
